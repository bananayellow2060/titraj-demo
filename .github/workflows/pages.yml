name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Decode binary assets
        run: |
          set -euo pipefail
          for f in encoded/*.tar.b64; do
            [ -f "$f" ] || continue
            base64 -d "$f" | tar -xf -
          done
          mkdir -p _site
          cp -a index.html 404.html .nojekyll metadata.json README.md _expo _site/
          if [ -f favicon.ico ]; then cp -a favicon.ico _site/; fi
          if [ -d assets ]; then cp -a assets _site/; fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
